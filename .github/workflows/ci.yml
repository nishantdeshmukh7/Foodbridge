name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./backend/package-lock.json
      
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build
      - run: sleep 10
      - name: Test Backend
        run: curl -f http://localhost:4000/health || exit 1
      - name: Test Frontend
        run: curl -f http://localhost:5174/ || exit 1
      - name: Run Trivy vulnerability scanner on Frontend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'foodbridge-frontend'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
      - name: Run Trivy vulnerability scanner on Backend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'foodbridge-backend'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
      - run: docker compose down
