name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: foodbridge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/foodbridge_test
      JWT_SECRET: ci-test-only-jwt-secret-value-not-real-1234567890
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./backend/package-lock.json

      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm test
      - run: npm run build

  integration:
    runs-on: ubuntu-latest
    # Only the db/backend/frontend services below are actually exercised by
    # this job (health-check curls, then Trivy scans of the backend/frontend
    # images) - the prometheus/grafana/cadvisor trio is local/CI
    # observability tooling, not part of the application (see
    # docker-compose.yml's own header comment). `docker compose` still
    # interpolates every service's environment up front, before filtering to
    # the requested service names, for BOTH `up` and `down` - so Grafana's
    # required GRAFANA_ADMIN_PASSWORD (deliberately no default - Phase 21
    # hardening) must be set for the whole job even though grafana itself is
    # never started here; this is a disposable CI-only value, never a real
    # credential.
    env:
      GRAFANA_ADMIN_PASSWORD: ci-only-unused-value-grafana-not-started
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build db backend frontend
      - run: sleep 10
      - name: Test Backend
        run: curl -f http://localhost:4000/health || exit 1
      - name: Test Frontend
        run: curl -f http://localhost:5174/ || exit 1
      - name: Run Trivy vulnerability scanner on Frontend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'foodbridge-frontend'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
      - name: Run Trivy vulnerability scanner on Backend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'foodbridge-backend'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
      - run: docker compose down
