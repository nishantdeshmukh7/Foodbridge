name: Docker Publish

# Builds both application images on every push to main and on tags, and
# additionally pushes them to GitHub Container Registry (ghcr.io) using the
# repo's own built-in GITHUB_TOKEN - no manual credential/secret setup is
# required, since GHCR is first-party GitHub infrastructure and the
# `packages: write` permission below is all a workflow needs to push to it.
#
# On a pull request this workflow only builds (to catch a broken Dockerfile
# early); it never pushes from a PR, since PRs from forks don't receive
# repository secrets/tokens with write access, and pushing from an
# unreviewed PR would be an unwanted side effect anyway.
on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: frontend
            context: .
            dockerfile: ./Dockerfile
          - image: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      # Pushes only outside pull_request context (see workflow header comment).
      # A PR build still runs through `docker build` via this same action
      # (push: false) so a broken Dockerfile fails CI before merge.
      - name: Build ${{ matrix.image }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
