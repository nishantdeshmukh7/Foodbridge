---
# Installs Docker Engine + the Compose plugin from Docker's own official
# apt repository (not the older, frequently-outdated Ubuntu/Debian
# distro package) - this is what lets `docker compose` (the exact command
# this repo's own Makefile and README already assume) work on a fresh host.
- name: Determine dpkg architecture (for the Docker apt repo URL)
  ansible.builtin.command: dpkg --print-architecture
  register: dpkg_arch
  changed_when: false
  check_mode: false

- name: Install prerequisite packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add Docker's official GPG key
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
    force: false # idempotent - never re-downloads once present

- name: Add Docker apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ dpkg_arch.stdout }} signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}
      {{ ansible_facts['distribution_release'] }} stable
    filename: docker
    state: present

- name: Install Docker Engine and Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Ensure docker service is enabled and running
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Add app_user to the docker group
  ansible.builtin.user:
    name: "{{ app_user }}"
    groups: docker
    append: true
