---
# UFW, default-deny inbound. Only the ports this repo's own
# docker-compose.prod.yml actually publishes to the host are opened - see
# that file's `ports:` block (80/443 on the frontend only; the backend
# publishes nothing) - plus SSH, so a misconfigured firewall never locks
# out the very connection Ansible is using to configure it.
- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Set default deny incoming policy
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Set default allow outgoing policy
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Allow SSH (so this playbook's own connection is never locked out)
  community.general.ufw:
    rule: limit # rate-limits repeated connection attempts (basic brute-force mitigation)
    port: "{{ ssh_port }}"
    proto: tcp

- name: Allow HTTP
  community.general.ufw:
    rule: allow
    port: "80"
    proto: tcp

- name: Allow HTTPS
  community.general.ufw:
    rule: allow
    port: "443"
    proto: tcp

- name: Allow node_exporter scrape port from the monitoring host only
  community.general.ufw:
    rule: allow
    port: "9100"
    proto: tcp
    src: "{{ monitoring_source_cidr }}"
  when: monitoring_source_cidr is defined and monitoring_source_cidr | length > 0

- name: Enable ufw
  community.general.ufw:
    state: enabled
