# EXAMPLE ONLY - copy to secret.yaml (already .gitignore'd, same convention
# as .env being gitignored at the repo root), replace every placeholder
# below with a real value, then `kubectl apply -f k8s/secret.yaml`.
# NEVER commit a real secret.yaml. NEVER put a real value directly in this
# file.
#
# Values here are stored as `stringData` (plaintext in the manifest you
# apply) rather than pre-base64-encoded `data`, purely so a human filling
# this in doesn't have to run `base64` by hand - Kubernetes itself stores it
# base64-encoded (not encrypted) either way. A Kubernetes Secret is NOT
# encryption at rest by default - see docs/SECURITY.md for what it does and
# does not protect against, and why a real deployment should enable etcd
# encryption at rest and/or an external secret manager (AWS Secrets
# Manager/Parameter Store, in the Terraform target architecture - see
# docs/TERRAFORM.md) instead of relying on this alone.
apiVersion: v1
kind: Secret
metadata:
  name: foodbridge-backend-secrets
  namespace: foodbridge
type: Opaque
stringData:
  # postgresql://USER:PASSWORD@HOST:PORT/DBNAME?schema=public
  # Points at the in-cluster Postgres (postgres.yaml) for local Minikube
  # testing, or an external managed database for a real deployment - same
  # DATABASE_URL contract the app already uses everywhere else in this repo.
  DATABASE_URL: "postgresql://postgres:REPLACE_ME@postgres:5432/foodbridge?schema=public"
  # Generate with: node -e "console.log(require('crypto').randomBytes(64).toString('hex'))"
  # Must be at least 32 characters and not one of the known placeholder
  # values the backend rejects at startup - see backend/src/config/index.ts.
  JWT_SECRET: "REPLACE_ME_WITH_A_REAL_64_BYTE_HEX_SECRET"
---
# Separate Secret consumed only by postgres.yaml (the in-cluster,
# local-testing-only Postgres - see that file's own header comment for why
# it exists and why it is not how a real deployment should run Postgres).
# Keeping it separate from foodbridge-backend-secrets above means a real
# deployment that points DATABASE_URL at an external managed database can
# skip creating this Secret entirely.
apiVersion: v1
kind: Secret
metadata:
  name: foodbridge-postgres-secrets
  namespace: foodbridge
type: Opaque
stringData:
  POSTGRES_PASSWORD: "REPLACE_ME"
