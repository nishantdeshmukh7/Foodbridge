# Phase 27: this nginx is the single public entry point for a production
# deployment using docker-compose.prod.yml - it serves the built frontend
# AND reverse-proxies /api and /health to the backend container over the
# internal Docker network (see docker-compose.prod.yml: the backend no
# longer publishes a host port at all - it is reachable only as
# "backend:3001" from other containers on the same Compose network, never
# from the public internet directly). See README.md's "Production
# Networking & Reverse Proxy" section for the full topology diagram and
# reasoning.
#
# Traffic map:
#   /            -> this container's own static files (the built SPA)
#   /api/*       -> proxied, byte-for-byte, to backend:3001/api/*
#   /health      -> proxied, byte-for-byte, to backend:3001/health
#   /nginx-health -> answered directly by nginx, never touches the backend -
#                    lets an operator/load balancer distinguish "nginx is
#                    up" from "nginx is up AND the backend/database are up"
#                    (that second, full-stack question is what /health
#                    answers - see backend/src/app.ts's checkDatabaseHealth()).
#
# TLS: this file listens on plain HTTP only, by design - shipping a config
# that references certificate files that don't exist would fail to start
# out of the box. See the commented HTTPS block and README.md's "HTTPS /
# TLS" section for exactly how to enable TLS termination here, or how to
# terminate TLS upstream of this container instead (a cloud load
# balancer/CDN in front of it) - both are supported; this repo does not
# assume which one you'll use, and never manages certificates for you.
#
# Phase 28: listens on 8080, not 80 - this container now runs as the
# non-root "nginx" user (see Dockerfile), which cannot bind a privileged
# port (<1024) without the NET_BIND_SERVICE capability, and dropping
# every capability it doesn't need (see docker-compose.prod.yml's
# cap_drop) is the point of that hardening. The public-facing port is
# unaffected - docker-compose.prod.yml maps host port 80 to this
# container's 8080 (and, if you enable HTTPS below, host 443 to container
# 8443), so nothing about the URLs users actually see changes.

server {
    listen 8080;
    # Explicit, rather than relying on the base image's entrypoint script
    # to patch this in automatically - that script can't write to this
    # file at all under the read-only root filesystem (Phase 28), so it
    # would otherwise silently skip IPv6 rather than erroring.
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Answered entirely by nginx - proves this container/process is up,
    # independent of the backend or database. Not the same question as
    # /health below.
    location = /nginx-health {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Phase 27: /api/* and /health are reverse-proxied to the backend over
    # the internal Docker network. proxy_pass has NO path component after
    # the upstream address in either block below - by nginx's own rule,
    # that means the full original request URI is forwarded unchanged
    # (no prefix rewriting), so backend/src/app.ts's existing route
    # mounts (app.use('/api/auth', ...), app.get('/health', ...)) are
    # reached exactly as they are today, with no path translation to get
    # wrong.
    location /api/ {
        proxy_pass http://backend:3001;

        # HTTP/1.1 + an explicitly cleared Connection header - required
        # for keepalive to the upstream; without this nginx defaults to
        # HTTP/1.0 semantics against the backend, closing a connection
        # per request.
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Preserves the original Host header (matters for anything on the
        # backend that ever reads it) and, more importantly, establishes
        # the one-hop X-Forwarded-* chain that TRUST_PROXY=1 (see
        # docker-compose.prod.yml / README.md's TRUST_PROXY section) is
        # calibrated for.
        proxy_set_header Host $host;
        # $proxy_add_x_forwarded_for - NOT $http_x_forwarded_for -
        # deliberately: this appends nginx's own view of the real
        # connecting peer to whatever X-Forwarded-For the client sent,
        # rather than passing a client-supplied value through unchanged.
        # A client cannot forge $remote_addr (it's nginx's own socket-
        # level observation of who connected), so even a spoofed
        # X-Forwarded-For from the client only ever appears as an EARLIER
        # entry in the chain - and Express, with trust proxy=1, trusts
        # only the LAST (rightmost) entry, i.e. exactly the one nginx
        # itself appended. See backend/src/test/trust-proxy.test.ts for
        # the Express-side half of this proof, and README.md's
        # "TRUST_PROXY" section for the full chain-of-trust reasoning -
        # this protection depends entirely on the backend being
        # unreachable except through this nginx (see "Port exposure").
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        # $scheme is "https" once this server block (or an upstream TLS
        # terminator that sets this itself) is actually serving over TLS
        # - see the HTTPS section below. Needed for anything on the
        # backend that ever needs to know the original request was
        # secure (nothing does today, but this is the correct value to
        # forward regardless).
        proxy_set_header X-Forwarded-Proto $scheme;

        # Generous but bounded - an internal Docker-network hop to the
        # backend should be near-instant; these exist to turn a genuinely
        # hung backend into a clean 504 for the client instead of an
        # indefinite hang, without being so tight that a normal request
        # under real load spuriously times out.
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location = /health {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    # Phase 27: basic hardening headers for the frontend's own responses
    # only (this location block, and the static-asset block below) -
    # deliberately not declared at the server level, so they are never
    # duplicated alongside (or accidentally shadow) whatever headers the
    # backend/helmet already sets on the proxied /api and /health
    # responses above. See README.md's "Security headers" section for
    # the full per-header reasoning and what to change if you add an
    # external resource this CSP doesn't already allow for.
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # script-src 'self' with no 'unsafe-inline': the production build
        # emits only same-origin bundled JS, no inline <script> tags and
        # no external script CDN - verified against this repo's actual
        # index.html/build output, not assumed. style-src needs
        # 'unsafe-inline' - Radix UI (this app's component primitives)
        # applies inline style attributes at runtime for
        # positioning/animation, and there is no nonce/hash mechanism
        # wired up for a static SPA build to avoid it safely. connect-src
        # 'self' matches this repo's recommended same-origin API
        # deployment (VITE_API_URL=/api, proxied above) - if you deploy
        # the frontend and backend on genuinely separate origins instead
        # (VITE_API_URL as an absolute URL), add that origin here too,
        # e.g. connect-src 'self' https://api.example.com, or fetch()
        # calls to it will be blocked by the browser.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        add_header X-Content-Type-Options "nosniff" always;
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}

# --------------------------------------------------------------------------
# Enabling HTTPS at this nginx (optional - only if you are terminating TLS
# here rather than at an upstream load balancer/CDN; see README.md's
# "HTTPS / TLS" section for how to choose between the two). This repository
# never manages or generates certificates - obtain them yourself (e.g.
# certbot/acme.sh against a real domain, or your platform's own cert
# issuance) and mount them into this container; nothing below is active by
# default.
#
# 1. Change the existing "server { listen 8080; ... }" block above to
#    redirect instead of serving content:
#      server {
#          listen 8080;
#          server_name your-real-domain.example.com;
#          return 301 https://$host$request_uri;
#      }
# 2. Add a second server block. Listens on 8443, not 443 - same
#    non-root/no-capabilities reasoning as the port-8080 change above
#    (Phase 28) - docker-compose.prod.yml's port mapping (step 3 below)
#    is what makes this reachable at the real, public 443 externally:
#      server {
#          listen 8443 ssl;
#          listen [::]:8443 ssl;
#          http2 on;
#          server_name your-real-domain.example.com;
#
#          ssl_certificate     /etc/nginx/certs/fullchain.pem;
#          ssl_certificate_key /etc/nginx/certs/privkey.pem;
#          ssl_protocols       TLSv1.2 TLSv1.3;
#
#          # HSTS - only ever send this once real TLS is actually in place
#          # and you intend every visit to be HTTPS from now on;
#          # "includeSubDomains" and a long max-age are hard to safely walk
#          # back once real users' browsers have cached them.
#          add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
#
#          # ... then the same root/index/location blocks as the port-8080
#          # server above (nginx-health, /api/, /health, /, static assets).
#      }
# 3. Mount your certificate files into the container (docker-compose.prod.yml):
#      volumes:
#        - /path/to/your/certs:/etc/nginx/certs:ro
#    and publish 443 alongside 80, mapped to the container's internal
#    8443 (not 443 - the container itself never listens on a privileged
#    port):
#      ports:
#        - "443:8443"
# 4. If you terminate TLS upstream of this container instead (a cloud load
#    balancer/CDN, which is the simpler and more common choice for a small
#    deployment on most hosting platforms), skip all of the above - this
#    container keeps listening on plain HTTP 8080 internally, the upstream
#    terminator forwards to it over your platform's own internal network,
#    and HSTS/redirect-to-HTTPS belong at that upstream layer instead,
#    since it - not this container - is the one actually terminating TLS.
# --------------------------------------------------------------------------
