services:
  db:
    image: postgres:15-alpine
    container_name: foodbridge-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: foodbridge
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: foodbridge-backend
    build:
      context: ./backend
    container_name: foodbridge-backend
    ports:
      - "4000:3001"
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/foodbridge?schema=public
      JWT_SECRET: development_secret_key
      PORT: 3001
      NODE_ENV: development
      FRONTEND_URL: http://localhost:5174
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && node dist/index.js"

  frontend:
    image: foodbridge-frontend
    build:
      context: .
      args:
        VITE_API_URL: http://localhost:4000/api
    container_name: foodbridge-frontend
    ports:
      - "5174:80"
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus:latest
    container_name: foodbridge-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - cadvisor

  grafana:
    image: grafana/grafana:latest
    container_name: foodbridge-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: foodbridge-cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
